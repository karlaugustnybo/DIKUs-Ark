schema_version = 2
profile_id = "iucn-any-touch-intersection-v2"

[coverage]
source = "IUCN range polygons"
resolution = 7
definition = "A species is present when the closed source range polygon and closed H3 cell intersect at any point, including a shared edge or vertex."
candidate_mode = "bbox_overlap"
candidate_tile_degrees = 10.0
large_candidate_tile_degrees = 2.5
large_candidate_bbox_degrees2 = 100.0
res3_derivation = "parent of an included resolution-7 cell"

[algorithm]
production_kernel = "direct-any-touch-v2"
coarse_resolution = 3
hierarchy_start_resolution = 2
small_polygon_bbox_degrees2 = 100.0
antimeridian_kernel = "direct-any-touch-v2"
candidate_simplification_degrees = 0.0
candidate_buffer_factor = 1.0
decision_simplification_degrees = 0.0

[row_policy]
presence = [1]
origin = [1, 2]
exclude_null_geometry = true
exclusion_precedence = ["null_iucn_sis_id", "null_geometry", "presence_policy", "origin_policy"]

[geometry_repair]
method = "shapely.make_valid"
max_relative_planar_area_change = 0.05
fail_when_original_area_is_zero = true

[runtime]
geometry_batch_rows = 128
pair_write_rows = 250000

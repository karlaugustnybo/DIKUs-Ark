name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Lint Python
        run: uv run ruff check .

      - name: Test Python
        run: uv run python -m unittest discover -s tests -v

      - name: Check prospective release contents
        run: uv run python scripts/check_release.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Check frontend types and Svelte
        working-directory: frontend
        run: bun run check

      - name: Test frontend
        working-directory: frontend
        run: bun test

      - name: Build frontend
        working-directory: frontend
        run: bun run build

[project]
name = "ark-iv"
version = "0.1.0"
description = "Priority map for the EBP."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.2",
    "rich>=13.7.0",
    "pyarrow>=24.0.0",
    "pandas>=3.0.3",
    "h3>=4.4.2",
    "psutil>=7.0",
    "geopandas>=1.0.0",
    "shapely>=2.0",
    "litestar>=2.18,<3",
    "granian>=2.5,<3",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.10,<3",
    "h3ronpy>=0.22,<0.23",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Local experiments are not part of the supported code release.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]
